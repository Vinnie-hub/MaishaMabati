<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Maisha Mabati</title>
<link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/dovhxt8ye/image/upload/v1789198256/maisha_mabti_favicon_mxerej.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-slot"></div>

<section class="page-hero">
  <div class="container">
    <h1>Get in Touch</h1>
    <p>We're here to help — reach us on WhatsApp, phone or email.</p>
  </div>
</section>

<section class="container">
  <div class="contact-grid">
    <div class="contact-info-card">
      <div class="contact-item">
        <div class="ico" data-icon="phone"></div>
        <div><h4>Phone</h4><p><a href="tel:+254785002606">+254 785 002 606</a></p></div>
      </div>
      <div class="contact-item">
        <div class="ico" data-icon="whatsapp"></div>
        <div><h4>WhatsApp</h4><p><a href="https://wa.me/254785002606" target="_blank" rel="noopener">Chat with us</a></p></div>
      </div>
      <div class="contact-item">
        <div class="ico" data-icon="mail"></div>
        <div><h4>Email</h4><p><a href="mailto:info@maishamabati.co.ke">info@maishamabati.co.ke</a></p></div>
      </div>
      <div class="contact-item">
        <div class="ico" data-icon="pin"></div>
        <div><h4>Location</h4><p>Ruiru, Kiambu County, Kenya</p></div>
      </div>
      <div class="contact-item">
        <div class="ico" data-icon="clock"></div>
        <div><h4>Opening Hours</h4><p>Mon–Fri: 9:00–20:00<br>Sat: 11:00–15:00</p></div>
      </div>
    </div>

    <div class="contact-form">
      <h3>Send us a message</h3>
      <form id="contact-form">
        <div class="form-group"><label>Your Name</label><input name="name" required></div>
        <div class="form-group"><label>Phone</label><input name="phone" required></div>
        <div class="form-group"><label>Message</label><textarea name="message" rows="5" required></textarea></div>
        <button type="submit" class="btn btn-green btn-block" id="contact-submit"></button>
      </form>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/compare.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('header-slot').innerHTML = renderHeader('contact');
  document.getElementById('footer-slot').innerHTML = renderFooter();
  initMobileMenu();

  document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = icon(el.dataset.icon, 22));
  document.getElementById('contact-submit').innerHTML = icon('whatsapp', 18) + ' Send via WhatsApp';

  document.getElementById('contact-form').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    const msg = `Name: ${f.name.value}\nPhone: ${f.phone.value}\nMessage: ${f.message.value}`;
    window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  });

  updateHeaderBadges();
});
</script>
</body>
</html>
