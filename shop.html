<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Maisha Mabati</title>
<link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/dovhxt8ye/image/upload/v1789198256/maisha_mabti_favicon_mxerej.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-slot"></div>

<section class="container">
  <div class="shop-layout">
    <aside class="filters">
      <div class="filter-group">
        <h4 data-icon-h="filter">Category</h4>
        <div id="cat-filters"></div>
      </div>
      <div class="filter-group">
        <h4>Max Price</h4>
        <input type="range" id="price-range" min="0" max="10000" step="100" value="10000">
        <div class="range-value">Up to <span id="price-value">KSh 10,000</span></div>
      </div>
      <div class="filter-group">
        <h4>Availability</h4>
        <label><input type="checkbox" id="filter-instock"> In stock only</label>
      </div>
      <div class="filter-group">
        <button class="btn btn-ghost btn-block" id="clear-filters">Clear Filters</button>
      </div>
    </aside>

    <div>
      <div class="shop-toolbar">
        <div class="results" id="results-count">Loading…</div>
        <select id="sort-select">
          <option value="default">Default sorting</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A–Z</option>
          <option value="name-desc">Name: Z–A</option>
        </select>
      </div>
      <div class="product-grid cols-4" id="shop-grid"></div>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/compare.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initHeaderAndFooter('shop');

  document.querySelectorAll('[data-icon-h]').forEach(el => {
    el.innerHTML = icon(el.dataset.iconH, 14) + ' ' + el.textContent;
  });

  const params = new URLSearchParams(location.search);
  let state = {
    search: params.get('search') || '',
    category: params.get('category') || '',
    maxPrice: 10000,
    inStock: false,
    sort: 'default'
  };

  const catWrap = document.getElementById('cat-filters');
  if (catWrap) {
    catWrap.innerHTML =
      `<label><input type="checkbox" value="" ${!state.category ? 'checked' : ''}> All</label>` +
      CONFIG.CATEGORIES.map(c =>
        `<label><input type="checkbox" value="${c}" ${state.category === c ? 'checked' : ''}> ${c}</label>`
      ).join('');

    catWrap.addEventListener('change', e => {
      if (e.target.value === '') {
        catWrap.querySelectorAll('input').forEach(i => i.checked = false);
        e.target.checked = true;
        state.category = '';
      } else {
        const allBox = catWrap.querySelector('input[value=""]');
        if (allBox) allBox.checked = false;
        catWrap.querySelectorAll('input').forEach(i => { if (i !== e.target) i.checked = false; });
        state.category = e.target.value;
      }
      renderShop();
    });
  }

  const priceRange = document.getElementById('price-range');
  if (priceRange) {
    priceRange.addEventListener('input', e => {
      state.maxPrice = Number(e.target.value);
      const pv = document.getElementById('price-value');
      if (pv) pv.textContent = 'KSh ' + state.maxPrice.toLocaleString();
      renderShop();
    });
  }

  const inStockEl = document.getElementById('filter-instock');
  if (inStockEl) {
    inStockEl.addEventListener('change', e => {
      state.inStock = e.target.checked;
      renderShop();
    });
  }

  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) {
    sortSelect.addEventListener('change', e => {
      state.sort = e.target.value;
      renderShop();
    });
  }

  const clearBtn = document.getElementById('clear-filters');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      state = { search: '', category: '', maxPrice: 10000, inStock: false, sort: 'default' };
      if (priceRange) priceRange.value = 10000;
      const pv = document.getElementById('price-value');
      if (pv) pv.textContent = 'KSh 10,000';
      if (inStockEl) inStockEl.checked = false;
      if (sortSelect) sortSelect.value = 'default';
      if (catWrap) {
        catWrap.querySelectorAll('input').forEach(i => i.checked = i.value === '');
      }
      renderShop();
    });
  }

  const headerSearch = document.querySelector('.search-bar');
  const shopSearchEl = document.getElementById('shop-search');

  let shopSearchInput = shopSearchEl;
  if (!shopSearchInput && headerSearch) {
    shopSearchInput = headerSearch.querySelector('input[type="search"]');
    if (shopSearchInput) shopSearchInput.id = 'shop-search';
  }

  if (shopSearchInput) {
    shopSearchInput.value = state.search;
    shopSearchInput.addEventListener('input', e => {
      state.search = e.target.value.trim();
      renderShop();
    });
  }

  if (headerSearch) {
    headerSearch.addEventListener('submit', e => {
      e.preventDefault();
      if (shopSearchInput) {
        state.search = shopSearchInput.value.trim();
      }
      renderShop();
    });
  }

  function renderShop() {
    let list = PRODUCTS.slice();

    if (state.search) {
      const q = state.search.toLowerCase();
      list = list.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q) ||
        p.keywords.some(k => k.toLowerCase().includes(q))
      );
    }

    if (state.category) list = list.filter(p => p.category === state.category);
    list = list.filter(p => (p.salePrice || p.price) <= state.maxPrice);
    if (state.inStock) list = list.filter(p => p.stock);

    switch (state.sort) {
      case 'price-asc':  list.sort((a,b) => (a.salePrice||a.price) - (b.salePrice||b.price)); break;
      case 'price-desc': list.sort((a,b) => (b.salePrice||b.price) - (a.salePrice||a.price)); break;
      case 'name-asc':   list.sort((a,b) => a.name.localeCompare(b.name)); break;
      case 'name-desc':  list.sort((a,b) => b.name.localeCompare(a.name)); break;
    }

    const grid = document.getElementById('shop-grid');
    const counter = document.getElementById('results-count');

    if (counter) {
      counter.textContent = `Showing ${list.length} of ${PRODUCTS.length} products`;
    }

    if (!grid) return;

    if (list.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <div class="ico">${icon('search', 50)}</div>
        <h3>No products found</h3>
        <p>Try adjusting your search or filters.</p>
      </div>`;
      return;
    }

    grid.innerHTML = list.map(renderProductCard).join('');
    updateHeaderBadges();
  }

  renderShop();
});
</script>
</body>
</html>
